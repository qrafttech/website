name: Publish scheduled articles

# Two kinds of PR merge themselves, without a human approval:
#
# - An article PR (`blog/<slug-fr>` branch, opened by `/publish`) on the
#   morning of its `date`, Paris time: the 48h before are the window to
#   object.
# - A TMBA talk PR (`tmba/<slug-fr>` branch, opened by the TMBA routine at
#   11:00 on the day of the talk) at 18:00 Paris time the same day, if it is
#   dated today: the afternoon is the window to object. A talk PR that misses
#   its day is merged by hand.
#
# A PR is held while it is a draft (a talk by an external speaker stays one
# until they agree), has a review requesting changes, failing or pending
# checks, a file without a `date` or a conflict with main; closing it cancels
# it. A PR from a fork is never merged: only a branch of this repo, which only
# a collaborator can push, qualifies.
#
# main requires an approving review. The workflow merges with git and pushes
# with the `BLOG_DEPLOY_KEY` deploy key, which the `Default` ruleset lets
# bypass; GitHub then marks the PR as merged.
on:
  schedule:
    # 04:30 in Paris in summer, 03:30 in winter: after midnight either way,
    # and well before the 9h social posts. Blog articles.
    - cron: "30 2 * * *"
    # 18:00 in Paris in summer, then in winter: the run that is not 18:00
    # yet in Paris stops early. TMBA talks.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      collection:
        description: "blog: articles dated today or before. tmba: talks dated today."
        type: choice
        options: [blog, tmba]
        default: blog

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the collection
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.collection }}
        run: |
          collection=${INPUT:-blog}
          if [ -n "$SCHEDULE" ] && [ "$SCHEDULE" != "30 2 * * *" ]; then
            collection=tmba
            if [ "$(TZ=Europe/Paris date +%H)" -lt 18 ]; then
              echo "Not 18:00 in Paris yet, skipped"
              collection=
            fi
          fi
          echo "collection=$collection" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pick.outputs.collection
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.BLOG_DEPLOY_KEY }}

      - name: Merge the PRs whose date has come
        if: steps.pick.outputs.collection
        env:
          COLLECTION: ${{ steps.pick.outputs.collection }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(TZ=Europe/Paris date +%F)
          prs=$(gh pr list --state open --limit 100 \
            --json number,headRefName,isDraft,reviewDecision,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not)
              | select(.headRefName | startswith(env.COLLECTION + "/")) | select(.isDraft | not)
              | select(.reviewDecision != "CHANGES_REQUESTED") | "\(.number) \(.headRefOid) \(.headRefName)"')

          echo "$prs" | while read -r pr sha branch; do
            if [ -z "$pr" ]; then continue; fi

            # The latest date among the content files of the PR: a file
            # without a date is a draft, and holds the PR.
            latest=""
            files=$(gh pr diff "$pr" --name-only | grep -E "^content/$COLLECTION/[^/]+/(fr|en)\.md$" || true)
            if [ -z "$files" ]; then echo "#$pr: no $COLLECTION file, skipped"; continue; fi
            for file in $files; do
              date=$(gh api "repos/$GH_REPO/contents/$file?ref=$sha" -H "Accept: application/vnd.github.raw" \
                | awk 'NR == 1 && $0 != "---" { exit } NR > 1 && $0 == "---" { exit } /^date:/ { print $2 }')
              if [ -z "$date" ]; then latest=draft; break; fi
              if [[ "$date" > "$latest" ]]; then latest=$date; fi
            done

            if [ "$latest" = draft ]; then echo "#$pr: draft, skipped"; continue; fi
            if [[ "$latest" > "$today" ]]; then echo "#$pr: scheduled for $latest, skipped"; continue; fi
            # A talk goes out on its day only: one that missed it is merged by hand.
            if [ "$COLLECTION" = tmba ] && [ "$latest" != "$today" ]; then
              echo "#$pr: dated $latest, not today, skipped"
              continue
            fi
            if ! gh pr checks "$pr" > /dev/null; then echo "#$pr: checks not green, skipped"; continue; fi

            git fetch -q origin "$sha" main
            git reset -q --hard origin/main
            if ! git merge -q --no-ff "$sha" -m "Merge pull request #$pr from $GH_REPO_OWNER/$branch" \
              -m "Daté du $latest, publié automatiquement."; then
              git merge --abort
              echo "#$pr: conflicts with main, skipped"
              continue
            fi
            git push -q origin HEAD:main
            git push -q origin --delete "$branch"
            echo "#$pr: merged ($latest)"
          done
