name: Publish scheduled articles

# An article PR (`blog/<slug-fr>` branch, opened by `/publish`) merges itself
# on the morning of its `date`, Paris time, without a human approval: the
# 48h before are the window to object. It is held while it is a draft, has a
# review requesting changes, failing or pending checks, a file without a
# `date` or a conflict with main; closing it cancels the article. A PR from a
# fork is never merged: only a branch of this repo, which only a collaborator
# can push, qualifies.
#
# main requires an approving review. The workflow merges with git and pushes
# with the `BLOG_DEPLOY_KEY` deploy key, which the `Default` ruleset lets
# bypass; GitHub then marks the PR as merged.
on:
  schedule:
    # 04:30 in Paris in summer, 03:30 in winter: after midnight either way,
    # and well before the 9h social posts.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.BLOG_DEPLOY_KEY }}

      - name: Merge the article PRs whose date has come
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(TZ=Europe/Paris date +%F)
          prs=$(gh pr list --state open --limit 100 \
            --json number,headRefName,isDraft,reviewDecision,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not)
              | select(.headRefName | startswith("blog/")) | select(.isDraft | not)
              | select(.reviewDecision != "CHANGES_REQUESTED") | "\(.number) \(.headRefOid) \(.headRefName)"')

          echo "$prs" | while read -r pr sha branch; do
            if [ -z "$pr" ]; then continue; fi

            # The latest date among the article files of the PR: a file
            # without a date is a draft, and holds the PR.
            latest=""
            files=$(gh pr diff "$pr" --name-only | grep -E '^content/blog/[^/]+/(fr|en)\.md$' || true)
            if [ -z "$files" ]; then echo "#$pr: no article file, skipped"; continue; fi
            for file in $files; do
              date=$(gh api "repos/$GH_REPO/contents/$file?ref=$sha" -H "Accept: application/vnd.github.raw" \
                | awk 'NR == 1 && $0 != "---" { exit } NR > 1 && $0 == "---" { exit } /^date:/ { print $2 }')
              if [ -z "$date" ]; then latest=draft; break; fi
              if [[ "$date" > "$latest" ]]; then latest=$date; fi
            done

            if [ "$latest" = draft ]; then echo "#$pr: draft, skipped"; continue; fi
            if [[ "$latest" > "$today" ]]; then echo "#$pr: scheduled for $latest, skipped"; continue; fi
            if ! gh pr checks "$pr" > /dev/null; then echo "#$pr: checks not green, skipped"; continue; fi

            git fetch -q origin "$sha" main
            git reset -q --hard origin/main
            if ! git merge -q --no-ff "$sha" -m "Merge pull request #$pr from $GH_REPO_OWNER/$branch" \
              -m "Article daté du $latest, publié automatiquement."; then
              git merge --abort
              echo "#$pr: conflicts with main, skipped"
              continue
            fi
            git push -q origin HEAD:main
            git push -q origin --delete "$branch"
            echo "#$pr: merged ($latest)"
          done
