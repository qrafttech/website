scripts:
  setup: cd "$ORCA_WORKTREE_PATH" && docker compose build web
  archive: cd "$ORCA_WORKTREE_PATH" && docker compose down -v

# The dev tab installs dependencies and starts Next.js: a tab is not bound by the setup-hook timeout.
# It picks a free port once and stores it in `.env`, which compose reads on its own: a later `make up`
# (an agent running lint, say) keeps the same port instead of recreating the container on a random one.
defaultTabs:
  - title: dev
    command: >-
      (grep -qs '^WEB_PORT=' .env
      || echo "WEB_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("", 0)); print(s.getsockname()[1])')" >> .env)
      && echo "http://$(hostname -s):$(sed -n 's/^WEB_PORT=//p' .env)"
      && docker compose up web
