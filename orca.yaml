scripts:
  setup: cd "$ORCA_WORKTREE_PATH" && docker compose build web
  archive: cd "$ORCA_WORKTREE_PATH" && docker compose down -v

# The dev tab installs dependencies and starts Next.js: a tab is not bound by the setup-hook timeout.
# It picks a free port first so it can print the URL, then keeps `docker compose up` in the foreground.
defaultTabs:
  - title: dev
    command: >-
      export WEB_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("", 0)); print(s.getsockname()[1])')
      && echo "http://$(hostname -s):$WEB_PORT"
      && docker compose up web
